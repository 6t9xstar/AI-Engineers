[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineers"
version = "1.0.0"
description = "The AI Engineer's Handbook, Architecture Reference & Runnable Production Toolkit (2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Malik Taimoor Awan", email = "6t9xstar@users.noreply.github.com" }
]
keywords = [
  "ai-engineer",
  "rag",
  "agents",
  "mcp",
  "model-context-protocol",
  "landlock",
  "sandboxing",
  "vllm",
  "evals"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/6t9xstar/AI-Engineers"
Repository = "https://github.com/6t9xstar/AI-Engineers"

[project.scripts]
ai-engineers = "ai_engineers:main"
